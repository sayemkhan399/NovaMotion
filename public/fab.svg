
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="mascot">
      <circle cx="32" cy="32" r="29"></circle>
    </clipPath>
  </defs>

  <!-- Circular cream face -->
  <circle cx="32" cy="32" r="29" fill="#FFFDF7" stroke="#18181B" stroke-width="3"></circle>

  <g clip-path="url(#mascot)">

    <!-- Cream foam details -->
    <circle cx="17" cy="17" r="2" fill="#18181B"></circle>
    <circle cx="27" cy="13" r="1.8" fill="#18181B"></circle>
    <circle cx="46" cy="19" r="1.5" fill="#18181B"></circle>

    <!-- Eyes -->
    <g fill="#18181B">
      <ellipse cx="24" cy="30" rx="3.2" ry="4.2"></ellipse>
      <ellipse cx="40" cy="30" rx="3.2" ry="4.2"></ellipse>
    </g>

    <!-- Eye highlights -->
    <g fill="#FFFFFF">
      <circle cx="25" cy="28.5" r="1"></circle>
      <circle cx="41" cy="28.5" r="1"></circle>
    </g>

    <!-- Happy smile -->
    <path d="M27 39 Q32 44 37 39" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" fill="none"></path>

    <!-- Dark liquid wave -->
    <path d="M0 48
         C12 42 20 52 31 47
         C42 42 52 43 64 47
         V64 H0 Z" fill="#18181B"></path>

  </g>
</svg>
